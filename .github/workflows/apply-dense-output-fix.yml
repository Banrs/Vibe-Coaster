name: Apply dense-output consistency fix

on:
  push:
    branches:
      - agent/issues-register-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-register-cleanup
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Replace the tautological dense-output metric
        run: python3 .github/apply_dense_output_fix.py
      - name: Verify targeted suites
        run: |
          godot --headless --path godot --editor --quit
          godot --headless --path godot --script res://dense_output_tests.gd
          godot --headless --path godot --script res://motion_tests.gd
      - name: Commit the tested patch and remove one-shot helpers
        shell: bash
        run: |
          rm .github/workflows/apply-dense-output-fix.yml .github/apply_dense_output_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot/motion.gd godot/motion_tests.gd \
            .github/workflows/apply-dense-output-fix.yml .github/apply_dense_output_fix.py
          git commit -m 'fix: measure dense-output consistency independently'
          git push origin HEAD:agent/issues-register-cleanup
