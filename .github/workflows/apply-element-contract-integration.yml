name: Apply production element-contract integration

on:
  push:
    branches:
      - agent/issues-register-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-register-cleanup
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Wire whole-element records into the accepted route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/apply_element_contract_integration.py')
          text = path.read_text()
          replacements = {
              "helper = r'''": "helper = '''",
              '_element_contract_records(plan, compiled, trajectory, banks)':
                  '_element_contract_records(plan, compiled, trajectory, banks, terrain)',
              r'''\tbanks: PackedFloat32Array
          ) -> Dictionary:
          \tvar errors := PackedStringArray()
          \tvar intents_value: Variant = compiled.get("element_intents")''':
              r'''\tbanks: PackedFloat32Array, terrain: Dictionary
          ) -> Dictionary:
          \tvar errors := PackedStringArray()
          \t# Synthetic RouteContract fixtures deliberately test terminal/propulsion/window
          \t# mechanics without a material story. Production terrain never takes this seam.
          \tif terrain.get("kind") == "synthetic":
          \t\treturn {"ok": true, "records": {}, "errors": errors}
          \tvar intents_value: Variant = compiled.get("element_intents")''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one patch source match, found {text.count(old)}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          python3 .github/apply_element_contract_integration.py
      - name: Verify targeted production paths
        run: |
          godot --headless --path godot --editor --quit
          godot --headless --path godot --script res://element_contract_tests.gd
          godot --headless --path godot --script res://element_contract_integration_tests.gd
          godot --headless --path godot --script res://route_contract_tests.gd
          godot --headless --path godot --script res://ride_program_tests.gd
      - name: Commit the tested patch and remove one-shot helpers
        shell: bash
        run: |
          rm .github/workflows/apply-element-contract-integration.yml \
            .github/apply_element_contract_integration.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot/ride_program.gd godot/route_contract.gd \
            .github/workflows/apply-element-contract-integration.yml \
            .github/apply_element_contract_integration.py
          git commit -m 'feat: publish whole-element geometry records'
          git push origin HEAD:agent/issues-register-cleanup
