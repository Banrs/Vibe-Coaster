name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight; main's own pushes are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  godot:
    runs-on: ubuntu-latest
    # Step timeouts cover the engine; this is the backstop for a hung checkout or engine install.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ci-diagnostics
          budget_ms=30000
          start_ns=$(date +%s%N)
          timeout 10m godot --headless --path godot --editor --quit 2>&1 \
            | tee out/ci-diagnostics/import.log
          elapsed_ms=$((($(date +%s%N) - start_ns) / 1000000))
          printf 'import_startup_ms=%s\nimport_startup_budget_ms=%s\n' \
            "$elapsed_ms" "$budget_ms" | tee out/ci-diagnostics/import-timing.txt
          (( elapsed_ms <= budget_ms )) || {
            echo "project import exceeded the startup budget" >&2
            exit 1
          }
      - name: Run focused test manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=.github/focused-tests.txt
          test -s "$manifest"
          mkdir -p out/ci-diagnostics
          executed=0
          while IFS= read -r script || [[ -n "$script" ]]; do
            [[ -z "$script" || "$script" == \#* ]] && continue
            [[ "$script" == res://* ]] || {
              echo "Focused test entry must start with res://: $script" >&2
              exit 1
            }
            path="godot/${script#res://}"
            test -f "$path"
            ((executed += 1))
            log_name="${script#res://}"
            timeout 5m godot --headless --path godot --script "$script" 2>&1 \
              | tee "out/ci-diagnostics/${log_name//\//_}.log"
          done < "$manifest"
          ((executed >= 1)) || {
            echo "Focused test manifest executed no entries" >&2
            exit 1
          }
      - name: Validate ride and meshes
        run: timeout 20m godot --headless --path godot --script res://smoke.gd
      - name: Measure first live viewer frame
        shell: bash
        run: |
          set -euo pipefail
          budget_ms=120000
          start_ns=$(date +%s%N)
          timeout 3m env VIEWER_SMOKE_FRAMES=1 godot --headless --path godot 2>&1 \
            | tee out/ci-diagnostics/viewer-first-frame.log
          elapsed_ms=$((($(date +%s%N) - start_ns) / 1000000))
          printf 'viewer_first_frame_ms=%s\nviewer_first_frame_budget_ms=%s\n' \
            "$elapsed_ms" "$budget_ms" | tee out/ci-diagnostics/viewer-first-frame-timing.txt
          (( elapsed_ms <= budget_ms )) || {
            echo "first live viewer frame exceeded the startup budget" >&2
            exit 1
          }
      # --quit-after counts engine frames, which all elapse while the generator thread is still
      # working: it used to exit before the first ride frame ever ran. VIEWER_SMOKE_FRAMES counts
      # live ride frames after the build lands, and exits 1 if the viewer rejects the route.
      - name: Exercise viewer runtime
        run: timeout 3m env VIEWER_SMOKE_FRAMES=120 godot --headless --path godot
      - name: Generate full-ride visual audit pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/visual-audit
          timeout 20m env INSPECT_OUT=out/visual-audit INSPECT_GENERATED_POVS=1 \
            godot --headless --path godot --script res://_inspect.gd \
            2>&1 | tee out/ci-diagnostics/visual-audit.log
          test -s out/visual-audit/manifest.json
          for seed in 11 42 20260809; do
            test -s "out/visual-audit/review/seed-$seed/top.png"
            test -s "out/visual-audit/review/seed-$seed/elevation.png"
            test -s "out/visual-audit/review/seed-$seed/channels.png"
          done
          element_count=$(find out/visual-audit/review/seed-42/elements \
            -type f -name '*.png' | wc -l)
          pov_count=$(find out/visual-audit/review/seed-42/pov \
            -type f -name '*.png' | wc -l)
          (( element_count >= 10 )) || {
            echo "full-ride visual audit produced too few element shots: $element_count" >&2
            exit 1
          }
          (( pov_count >= 10 )) || {
            echo "full-ride visual audit produced too few POV shots: $pov_count" >&2
            exit 1
          }
          printf 'visual_seed_count=3\nvisual_element_shot_count=%s\nvisual_pov_shot_count=%s\n' \
            "$element_count" "$pov_count" | tee out/ci-diagnostics/visual-audit-summary.txt
      - name: Upload bounded CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            out/ci-diagnostics
            out/visual-audit
          if-no-files-found: ignore
          retention-days: 7
