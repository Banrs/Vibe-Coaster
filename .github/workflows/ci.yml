name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  legacy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project classes
        run: godot --headless --path godot --editor --quit
      - name: Run legacy audit exactly once
        shell: bash
        run: |
          mkdir -p out/legacy-audit
          set -o pipefail
          INSPECT_OUT="$PWD/out/legacy-audit" godot --headless --path godot --script res://_inspect.gd 2>&1 | tee out/legacy-audit-stdout.txt
      - name: Characterize seed 42 stable beat IDs
        env:
          INVENTORY_OUT: ${{ github.workspace }}/out/seed-42-element-payload.txt
        run: godot --headless --path godot --script res://_ci_legacy_inventory.gd
      - name: Inventory complete audit pack
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -d out/legacy-audit ]; then
            find out/legacy-audit -type f -printf '%P\n' | LC_ALL=C sort > out/legacy-audit-file-list.txt
          else
            : > out/legacy-audit-file-list.txt
          fi
          cat out/legacy-audit-file-list.txt
      - name: Upload legacy audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: legacy-audit-${{ github.sha }}
          path: |
            out/legacy-audit
            out/legacy-audit-stdout.txt
            out/legacy-audit-file-list.txt
            out/seed-42-element-payload.txt
          if-no-files-found: error

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path godot --editor --quit
      - name: Validate ride and meshes
        run: godot --headless --path godot --script res://smoke.gd
      - name: Exercise viewer runtime
        run: godot --headless --path godot --quit-after 120
