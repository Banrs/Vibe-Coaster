name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path godot --editor --quit
      - name: Validate ride and meshes
        run: godot --headless --path godot --script res://smoke.gd
      - name: Exercise viewer runtime
        run: godot --headless --path godot --quit-after 120
