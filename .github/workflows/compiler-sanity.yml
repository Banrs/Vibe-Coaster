name: Compiler sanity

on:
  push:
    branches:
      - agent/spatial-v2-refoundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.3", "4.7.1"]
    runs-on: ubuntu-latest
    steps:
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot }}
          use-dotnet: false
          include-templates: false
      - name: Probe decimal literals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe out/godot-${{ matrix.godot }}
          cat > probe/project.godot <<'EOF'
          config_version=5
          EOF
          cat > probe/literals.gd <<'EOF'
          extends SceneTree
          func _initialize() -> void:
              var values := [0.03, 0.04, 0.05, 0.10, 0.23, 0.70, 0.97]
              var expected := [3.0 / 100.0, 4.0 / 100.0, 5.0 / 100.0, 10.0 / 100.0,
                  23.0 / 100.0, 70.0 / 100.0, 97.0 / 100.0]
              print(JSON.stringify({"version": Engine.get_version_info(), "values": values,
                  "expected": expected}))
              var ok := true
              for index in values.size():
                  ok = ok and absf(float(values[index]) - float(expected[index])) <= 1.0e-12
              quit(0 if ok else 1)
          EOF
          set +e
          godot --headless --path probe --script res://literals.gd 2>&1 | tee out/godot-${{ matrix.godot }}/probe.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > out/godot-${{ matrix.godot }}/status.txt
          cp "$(command -v godot)" out/godot-${{ matrix.godot }}/godot
          chmod +x out/godot-${{ matrix.godot }}/godot
          godot --version > out/godot-${{ matrix.godot }}/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: godot-${{ matrix.godot }}-compiler-probe
          path: out/godot-${{ matrix.godot }}
          retention-days: 1
