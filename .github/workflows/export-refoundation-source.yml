name: Export refoundation source

on:
  push:
    branches:
      - agent/full-refoundation

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build repository inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/refoundation
          {
            echo '# Repository inventory'
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo '## Directory sizes'
            du -ah --exclude=.git --exclude=.godot . | sort -h
            echo
            echo '## Source line counts'
            find . -path ./.git -prune -o -path ./.godot -prune -o -type f \
              \( -name '*.gd' -o -name '*.py' -o -name '*.yml' -o -name '*.yaml' \
                 -o -name '*.md' -o -name '*.json' -o -name '*.sh' -o -name '*.cmd' \) \
              -print0 | xargs -0 wc -l | sort -n
            echo
            echo '## Tracked files'
            git ls-files
          } > out/refoundation/inventory.txt
          python3 - <<'PY'
          from pathlib import Path
          import json

          rows = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.godot' in path.parts:
                  continue
              data = path.read_bytes()
              try:
                  lines = data.count(b'\n') + (1 if data and not data.endswith(b'\n') else 0)
              except Exception:
                  lines = None
              rows.append({
                  'path': path.as_posix(),
                  'bytes': len(data),
                  'lines': lines,
                  'suffix': path.suffix.lower(),
              })
          rows.sort(key=lambda row: (-row['bytes'], row['path']))
          Path('out/refoundation/inventory.json').write_text(
              json.dumps({'files': rows}, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload source snapshot and inventory
        uses: actions/upload-artifact@v4
        with:
          name: refoundation-source
          path: |
            .
            !.git/**
            !.godot/**
          include-hidden-files: true
          retention-days: 7
