[workspace]
resolver = "3"
members = ["crates/vc-math", "crates/vc-ride", "crates/vc-godot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Banrs/Vibe-Coaster"

[workspace.lints.rust]
missing_docs = "warn"
# Deny rather than forbid: the future C ABI crate needs a scoped opt-out.
unsafe_code = "deny"

[workspace.lints.clippy]
float_cmp = "warn"

[profile.release]
# Determinism is a project requirement: same model in, same ride out. Nothing
# here changes float semantics (rustc never enables fast-math), but LTO and a
# single codegen unit keep optimisation decisions stable across builds.
lto = "thin"
codegen-units = 1
