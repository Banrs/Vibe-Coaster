<!doctype html>
<meta charset="utf-8">
<title>Vibe-Coaster POV</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #06080d; color: #d7dee8; overflow: hidden;
         font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { display: block; }
  .panel { position: fixed; background: #0d1219cc; border: 1px solid #1f2937;
           border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(6px); }
  #hud { top: 12px; left: 12px; min-width: 220px; }
  #hud b { font-size: 27px; font-weight: 600; color: #f1f5f9; }
  #note { top: 12px; right: 12px; max-width: 300px; }
  #ctl { bottom: 12px; left: 12px; right: 12px; display: flex; gap: 14px;
         align-items: center; flex-wrap: wrap; }
  #scrub { flex: 1; min-width: 160px; accent-color: #38bdf8; }
  button, select { background: #172033; color: #d7dee8; border: 1px solid #2b3648;
           border-radius: 6px; padding: 5px 11px; font: inherit; cursor: pointer; }
  button:hover, select:hover { background: #1e293b; }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .dim { color: #7c8899; }
  .bar { height: 5px; background: #1b2433; border-radius: 3px; margin: 3px 0 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #38bdf8; }
  .warn { color: #fbbf24; }
  hr { border: 0; border-top: 1px solid #1f2937; margin: 8px 0; }
</style>

<canvas id="c"></canvas>
<div class="panel" id="hud"></div>
<div class="panel" id="note"></div>
<div class="panel" id="ctl">
  <button id="play">pause</button>
  <input type="range" id="scrub" min="0" max="1000" value="0">
  <label>row <select id="row"></select></label>
  <label>rate <select id="rate">
    <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
    <option value="1" selected>1x</option><option value="2">2x</option>
  </select></label>
  <button id="view">chase cam</button>
</div>

<script>
const R = "__RIDE__";
const N = R.s.length;
const c = document.getElementById("c"), g = c.getContext("2d");

const pos = i => [R.x[i], R.y[i], R.z[i]];
const tan = i => [R.tx[i], R.ty[i], R.tz[i]];
const upv = i => [R.ux[i], R.uy[i], R.uz[i]];
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const mix = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];

// The rider's right is tangent x up — the same invariant the core keeps, so the
// viewer never needs its own idea of which way is which.
const right = i => cross(tan(i), upv(i));

function indexAt(s) {
  let lo = 0, hi = N - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (R.s[m] <= s) lo = m; else hi = m; }
  const span = R.s[hi] - R.s[lo];
  return { a: lo, b: hi, t: span > 0 ? (s - R.s[lo]) / span : 0 };
}
const val = (f, k) => R[k][f.a] + (R[k][f.b] - R[k][f.a]) * f.t;

const GAUGE = 1.9, RAIL_DROP = 1.05, EYE = 0.55;
let s = 0, playing = true, chase = false, row = 0, rate = 1;

function seatAt(distance) {
  const f = indexAt(Math.max(0, Math.min(R.meta.length, distance)));
  const p = mix(pos(f.a), pos(f.b), f.t);
  const fwd = mix(tan(f.a), tan(f.b), f.t);
  const up = mix(upv(f.a), upv(f.b), f.t);
  return { f, p, fwd, up, rt: cross(fwd, up) };
}

function project(cam, world, w, h) {
  const d = sub(world, cam.eye);
  const z = dot(d, cam.fwd);
  if (z < 0.4) return null;
  const scale = h * 0.9 / z;
  return [w / 2 + scale * dot(d, cam.rt), h / 2 - scale * dot(d, cam.up)];
}

function drawTerrain(cam, w, h) {
  const T = R.terrain, sp = T.spacing;
  g.strokeStyle = "#28323f"; g.lineWidth = devicePixelRatio; g.beginPath();
  for (let j = 0; j < T.ny; j++) for (let i = 0; i < T.nx; i++) {
    const x = T.originX + i * sp, y = T.originY + j * sp;
    if (Math.hypot(x - cam.eye[0], y - cam.eye[1]) > 3000) continue;
    const a = project(cam, [x, y, T.h[j * T.nx + i]], w, h);
    if (!a) continue;
    for (const [di, dj] of [[1, 0], [0, 1]]) {
      const ni = i + di, nj = j + dj;
      if (ni >= T.nx || nj >= T.ny) continue;
      const b = project(cam, [T.originX + ni * sp, T.originY + nj * sp, T.h[nj * T.nx + ni]], w, h);
      if (b) { g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
    }
  }
  g.stroke();
}

function drawTrack(cam, w, h, from) {
  const rails = [[], []], ties = [];
  for (let k = Math.max(0, from - 80); k < Math.min(N, from + 700); k++) {
    const base = add(pos(k), upv(k), -RAIL_DROP), rt = right(k);
    const l = project(cam, add(base, rt, -GAUGE / 2), w, h);
    const r = project(cam, add(base, rt, GAUGE / 2), w, h);
    rails[0].push(l); rails[1].push(r);
    if (k % 5 === 0 && l && r) ties.push([l, r]);
  }
  g.strokeStyle = "#46566d"; g.lineWidth = devicePixelRatio; g.beginPath();
  for (const [a, b] of ties) { g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
  g.stroke();
  g.strokeStyle = "#cfe0f5"; g.lineWidth = 2.2 * devicePixelRatio;
  for (const rail of rails) {
    g.beginPath();
    let pen = false;
    for (const p of rail) {
      if (!p) { pen = false; continue; }
      pen ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]);
      pen = true;
    }
    g.stroke();
  }
}

function meter(label, value, max, over) {
  return `<div class="row"><span class="dim">${label}</span>
    <span class="${over ? "warn" : ""}">${value.toFixed(2)} g</span></div>
    <div class="bar"><i style="width:${Math.min(100, Math.abs(value) / max * 100)}%"></i></div>`;
}

function frame(now) {
  const dt = Math.min(0.05, (now - frame.last) / 1000); frame.last = now;
  if (playing) {
    s += val(indexAt(s), "v") * dt * rate;
    if (s > R.meta.length) s = 0;
    scrub.value = s / R.meta.length * 1000;
  }

  const w = c.width = innerWidth * devicePixelRatio;
  const h = c.height = innerHeight * devicePixelRatio;
  c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";

  const seat = seatAt(s - R.rowOffsets[row]);
  const cam = chase
    ? { ...seat, eye: add(add(seat.p, seat.fwd, -26), seat.up, 9) }
    : { ...seat, eye: add(seat.p, seat.up, EYE) };

  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, "#0a1424"); sky.addColorStop(0.55, "#16233a"); sky.addColorStop(1, "#231b15");
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  drawTerrain(cam, w, h);
  drawTrack(cam, w, h, seat.f.a);

  const f = seat.f, gn = val(f, "gn"), gl = val(f, "gl"), gx = val(f, "gx");
  hud.innerHTML =
    `<b>${(val(f, "v") * 3.6).toFixed(0)}</b> <span class="dim">km/h</span>
     <div class="row dim"><span>${(R.elements[R.el[f.a]] || {}).name}</span>
       <span>${val(f, "t").toFixed(1)} s</span></div>
     <div class="row dim"><span>row ${row + 1} of ${R.rowOffsets.length}</span>
       <span>${val(f, "s").toFixed(0)} / ${R.meta.length.toFixed(0)} m</span></div><hr>
     ${meter("vertical", gn, 7, gn > 7 || gn < -2.5)}
     ${meter("lateral", gl, 3.5, Math.abs(gl) > 3.5)}
     ${meter("longitudinal", gx, 7, Math.abs(gx) > 7)}`;

  requestAnimationFrame(frame);
}
frame.last = performance.now();

R.rowOffsets.forEach((o, i) => row_.add(new Option(`${i + 1} — ${o.toFixed(1)} m back`, i)));
row_.value = row = R.rowOffsets.length - 1;
row_.onchange = e => row = +e.target.value;
rate_.onchange = e => rate = +e.target.value;
play.onclick = e => { playing = !playing; e.target.textContent = playing ? "pause" : "play"; };
view.onclick = e => { chase = !chase; e.target.textContent = chase ? "pov cam" : "chase cam"; };
scrub.oninput = () => s = +scrub.value / 1000 * R.meta.length;

const failed = R.checks.filter(k => k.over > 0);
note.innerHTML =
  `<div class="row"><span class="dim">length</span><span>${R.meta.length.toFixed(0)} m</span></div>
   <div class="row"><span class="dim">top speed</span><span>${(R.meta.topSpeed * 3.6).toFixed(0)} km/h</span></div>
   <div class="row"><span class="dim">duration</span><span>${R.meta.duration.toFixed(0)} s</span></div>
   <div class="row"><span class="dim">highest</span><span>${R.meta.highest.toFixed(0)} m over station</span></div>
   <div class="row"><span class="dim">clearance</span><span>${R.meta.minClearance.toFixed(1)} m</span></div><hr>
   <div class="${failed.length ? "warn" : "dim"}">${
     failed.length ? failed.map(k => k.name).join("<br>") : "every limit met"}</div>
   <div class="dim" style="margin-top:6px">${R.meta.note}</div>`;

requestAnimationFrame(frame);
</script>
